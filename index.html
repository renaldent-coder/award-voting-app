<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUG Awards - Vote Now</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏆 SUG AWARDS</h1>
    <h2>Bayelsa State Polytechnic, Aleibiri</h2>
    <p>3rd Award Week Presentation • Sat 22 Aug 2026</p>
  </div>

  <form id="votingForm">
    <div class="voter-info">
      <input type="text" id="voterName" placeholder="Your Full Name" required />
      <input type="email" id="voterEmail" placeholder="Your Email Address" required />
    </div>

    <div id="categoriesContainer"></div>

    <button type="submit">Submit Votes</button>
  </form>

  <div id="message"></div>
</div>

<!-- Import Map - tells browser where to find Supabase -->
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0"
  }
}
</script>

<!-- Load script.js as a module -->
<script type="module" src="script.js"></script>

</body>
</html>
