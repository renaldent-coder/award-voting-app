<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - SUG Awards</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container { max-width: 1200px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .admin-password { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
    .admin-password input { padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; flex: 1; min-width: 200px; }
    .admin-password button { padding: 10px 24px; background: #ffd700; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0a0a2a; }
    .category-result { margin: 25px 0; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; border-left: 4px solid #ffd700; }
    .category-result h3 { color: #ffd700; margin-bottom: 10px; }
    .nominee-row { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .nominee-row .rank { color: #888; margin-right: 10px; }
    .nominee-row .name { flex: 1; }
    .nominee-row .count { color: #ffd700; font-weight: bold; }
    .gold { color: #ffd700; } .silver { color: #c0c0c0; } .bronze { color: #cd7f32; }
    #stats { margin: 15px 0; color: #888; font-size: 0.9rem; }
    #allVotes { margin-top: 40px; }
    #allVotes table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    #allVotes th { text-align: left; padding: 8px; border-bottom: 2px solid #ffd700; color: #ffd700; }
    #allVotes td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .export-btn { padding: 8px 16px; background: #2a2a5a; border: 1px solid #ffd700; color: #fff; border-radius: 6px; cursor: pointer; }
    .loading { color: #888; text-align: center; padding: 40px; }
  </style>
</head>
<body>
<div class="container admin-container">
  <div class="admin-header">
    <h1>🔐 Admin Dashboard</h1>
    <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
  </div>

  <div class="admin-password">
    <input type="password" id="adminPassword" placeholder="Enter admin password..." />
    <button onclick="loadResults()">View Results</button>
  </div>

  <div id="stats"></div>
  <div id="results"></div>
  <div id="allVotes"></div>
</div>

<script>
  const ADMIN_PASSWORD = 'SUGADMIN2026'

  async function loadResults() {
    const password = document.getElementById('adminPassword').value
    if (!password) { alert('Enter password'); return }

    document.getElementById('results').innerHTML = '<div class="loading">Loading...</div>'

    try {
      const res = await fetch('/api/results', {
        headers: { 'x-admin-password': password }
      })
      const data = await res.json()

      if (!res.ok) {
        document.getElementById('results').innerHTML = `<p style="color:red">❌ ${data.error || 'Unauthorized'}</p>`
        return
      }

      displayResults(data)
    } catch (err) {
      document.getElementById('results').innerHTML = `<p style="color:red">❌ Error: ${err.message}</p>`
    }
  }

  function displayResults(data) {
    const { results, total_votes, votes } = data

    document.getElementById('stats').innerHTML = `📊 Total Votes: <strong>${total_votes}</strong>`

    let html = ''
    const categoryOrder = [
      "BEST STUDENT OF THE YEAR", "MOST OUTSTANDING STUDENT", "BEST DEPARTMENT OF THE YEAR",
      "OUTSTANDING S.U.G EXECUTIVE", "BEST COURSE REP OF THE YEAR", "BEST DEAN OF THE YEAR",
      "OUTSTANDING LEADER OF THE YEAR", "BEST MALE LECTURER OF THE YEAR",
      "BEST STUDENT ENTREPRENEUR OF THE YEAR", "BEST FEMALE LECTURER OF THE YEAR",
      "BEST TICKOTER OF THE YEAR", "PHOTOGRAPHER OF THE YEAR", "FASHION ICON OF THE YEAR",
      "SPORT PERSONALITY OF THE YEAR", "BEST MALE DRESSED OF THE YEAR",
      "BEST FEMALE COMRADE OF THE YEAR", "BEST FEMALE DRESSED OF THE YEAR",
      "MOST SUPPORTIVE LEADER OF THE YEAR", "MOST VULNERABLE PLAYER (M.V.P)",
      "OUTSTANDING COMRADE OF THE YEAR", "BEST COOPERATE STUDENT OF THE YEAR",
      "MOST BEAUTIFUL GIRL", "MOST SOCIAL STUDENT", "MOST CUTE GUY OF THE YEAR",
      "BEST HOD OF THE YEAR", "BEST CHRISTIAN PERSONALITY", "EXCELLENCE",
      "OUTSTANDING DIRECTOR OF THE YEAR", "BEST RED CARPET HOST OF THE YEAR"
    ]

    categoryOrder.forEach(cat => {
      if (results[cat] && results[cat].length > 0) {
        const medals = ['🥇', '🥈', '🥉']
        html += `<div class="category-result"><h3>🏆 ${cat}</h3>`
        results[cat].forEach((item, i) => {
          const medal = medals[i] || `${i+1}.`
          const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : ''
          html += `<div class="nominee-row">
            <span class="rank">${medal}</span>
            <span class="name ${cls}">${item.name}</span>
            <span class="count">${item.count} vote${item.count > 1 ? 's' : ''}</span>
          </div>`
        })
        html += '</div>'
      } else {
        html += `<div class="category-result"><h3>🏆 ${cat}</h3><p style="color:#666">No votes yet</p></div>`
      }
    })

    document.getElementById('results').innerHTML = html

    // Show all votes table
    if (votes && votes.length > 0) {
      let tableHtml = `<h3>📋 All Votes (${votes.length})</h3><table>
        <tr><th>Voter</th><th>Email</th><th>Category</th><th>Nominee</th><th>Time</th></tr>`
      votes.slice(0, 100).forEach(v => {
        tableHtml += `<tr><td>${v.voter_name}</td><td>${v.email}</td><td>${v.category_name}</td><td>${v.nominee_name}</td><td>${new Date(v.created_at).toLocaleString()}</td></tr>`
      })
      tableHtml += '</table>'
      if (votes.length > 100) tableHtml += `<p style="color:#666">Showing first 100 of ${votes.length} votes</p>`
      document.getElementById('allVotes').innerHTML = tableHtml
    }
  }

  async function exportCSV() {
    const password = document.getElementById('adminPassword').value
    if (!password) { alert('Enter password first'); return }

    const res = await fetch('/api/results', {
      headers: { 'x-admin-password': password }
    })
    const data = await res.json()
    if (!res.ok) { alert('Unauthorized'); return }

    let csv = 'Voter,Email,Category,Nominee,Time\n'
    data.votes.forEach(v => {
      csv += `"${v.voter_name}","${v.email}","${v.category_name}","${v.nominee_name}","${v.created_at}"\n`
    })

    const blob = new Blob([csv], { type: 'text/csv' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = 'award_votes.csv'
    a.click()
    URL.revokeObjectURL(url)
  }
</script>
</body>
</html>
